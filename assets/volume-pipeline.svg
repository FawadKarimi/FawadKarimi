<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="880" height="160" role="img" aria-labelledby="ptitle">
  <title id="ptitle">Volumetric research pipeline</title>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0b1524"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="880" height="160" rx="8" fill="url(#pbg)" stroke="#1e293b"/>

  <text x="28" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#64748b" letter-spacing="1.5">RESEARCH PIPELINE · VOLUMETRIC CT</text>

  <!-- stage cards -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- 01 -->
    <rect x="28" y="44" width="180" height="88" rx="8" fill="url(#card)" stroke="#1e293b"/>
    <text x="44" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#22d3ee">01 / INPUT</text>
    <text x="44" y="92" font-size="15" font-weight="600" fill="#f1f5f9">Full CT volume</text>
    <text x="44" y="112" font-size="11" fill="#94a3b8">DICOM · HU window · resample</text>

    <path d="M218 88 H246" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- 02 -->
    <rect x="248" y="44" width="180" height="88" rx="8" fill="url(#card)" stroke="#164e63"/>
    <text x="264" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#22d3ee">02 / DETECT</text>
    <text x="264" y="92" font-size="15" font-weight="600" fill="#f1f5f9">3D candidates</text>
    <text x="264" y="112" font-size="11" fill="#94a3b8">CNN · Transformer tokens</text>

    <path d="M438 88 H466" stroke="#334155" stroke-width="1.5"/>

    <!-- 03 -->
    <rect x="468" y="44" width="180" height="88" rx="8" fill="url(#card)" stroke="#164e63"/>
    <text x="484" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#22d3ee">03 / REFINE</text>
    <text x="484" y="92" font-size="15" font-weight="600" fill="#f1f5f9">FP reduction</text>
    <text x="484" y="112" font-size="11" fill="#94a3b8">attention · gated fusion</text>

    <path d="M658 88 H686" stroke="#334155" stroke-width="1.5"/>

    <!-- 04 -->
    <rect x="688" y="44" width="164" height="88" rx="8" fill="url(#card)" stroke="#0e7490"/>
    <text x="704" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#67e8f9">04 / TRUST</text>
    <text x="704" y="92" font-size="15" font-weight="600" fill="#f1f5f9">Patient eval</text>
    <text x="704" y="112" font-size="11" fill="#94a3b8">calibrate · explain</text>
  </g>

  <text x="28" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#475569">patient-disjoint splits · matched seeds · report every seed  not only the best</text>
</svg>
